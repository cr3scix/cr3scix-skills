name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, intl
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app scripts
        run: for f in apps/*/app.js apps/*/vendor/*.js; do node --check "$f"; done
      - name: Open every app in Chromium
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          php -S 127.0.0.1:8081 index.php > /dev/null 2>&1 &
          sleep 1
          node tests/browser.js

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post checker smoke test
        run: |
          echo "Short, clean post." | python3 agent-skills/skills/social-media/scripts/check_post.py - --platform x,bluesky
          python3 -c "print('a' * 300)" | python3 agent-skills/skills/social-media/scripts/check_post.py - --platform x && exit 1 || echo "over-limit draft correctly failed"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the image
        run: |
          docker build -t toolkit .
          docker run -d -p 8080:80 --name toolkit toolkit
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/skills > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q 'Cr3scix Toolkit'
          curl -fs -X POST http://127.0.0.1:8080/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q json-tools
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/src/Env.php)" = 403
